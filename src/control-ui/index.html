<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LX Control UI</title>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <div id="app">
    <div class="container">
      <!-- Controls will be dynamically added here -->
      <div class="info">
        <p class="status">Connecting...</p>
        <button class="toggle-log">Show Log</button>
        <button class="query-paths-btn">Debug: Query OSC Paths</button>
        <div class="log-container">
          <div class="log-controls">
            <label>
              <input type="checkbox" class="filter-outgoing" checked> Outgoing
            </label>
            <label>
              <input type="checkbox" class="filter-incoming"> Incoming
            </label>
            <label>
              <input type="checkbox" class="filter-info"> Info
            </label>
          </div>
          <div class="log-content"></div>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
