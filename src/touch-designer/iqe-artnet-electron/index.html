<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>IQE ArtNet LED Visualizer - 420x24</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #000;
      color: #fff;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', 'Fira Code', monospace;
      overflow: hidden;
      display: flex;
      height: 100vh;
    }

    #main-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0; /* Allow shrinking */
    }

    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      position: relative;
      background: radial-gradient(circle at center, #0a0a0a 0%, #000 100%);
    }

    #led-canvas {
      max-width: 100%;
      max-height: 100%;
      width: auto;
      height: auto;
      image-rendering: auto; /* Allow smooth rendering for better visibility */
      image-rendering: optimizeQuality;
      box-shadow: 0 0 30px rgba(0, 255, 0, 0.3);
      border: 1px solid rgba(0, 255, 0, 0.1);
    }

    #controls {
      padding: 15px 20px;
      background-color: #0a0a0a;
      border-top: 1px solid #222;
      display: flex;
      align-items: center;
      gap: 25px;
      flex-wrap: wrap;
    }

    #sidebar {
      width: 350px;
      background-color: #050505;
      border-left: 1px solid #222;
      display: flex;
      flex-direction: column;
      transition: width 0.3s ease;
    }

    #sidebar.collapsed {
      width: 40px;
    }

    #sidebar-header {
      padding: 15px;
      background-color: #0a0a0a;
      border-bottom: 1px solid #222;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    #sidebar-title {
      font-size: 14px;
      font-weight: 600;
      color: #0f0;
    }

    #sidebar.collapsed #sidebar-title {
      display: none;
    }

    #toggle-sidebar {
      background: none;
      border: none;
      color: #666;
      cursor: pointer;
      padding: 5px;
      font-size: 18px;
    }

    #toggle-sidebar:hover {
      color: #fff;
    }

    #stats {
      padding: 15px;
      font-size: 12px;
      line-height: 1.6;
      border-bottom: 1px solid #222;
    }

    #sidebar.collapsed #stats {
      display: none;
    }

    #log-container {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      font-size: 11px;
      font-family: 'Courier New', monospace;
    }

    #sidebar.collapsed #log-container {
      display: none;
    }

    .log-entry {
      margin: 2px 0;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .log-time {
      color: #666;
      margin-right: 8px;
    }

    .log-success {
      color: #0f0;
    }

    .log-warning {
      color: #f80;
    }

    .log-error {
      color: #f00;
    }

    button {
      background-color: #1a1a1a;
      color: #ccc;
      border: 1px solid #333;
      padding: 8px 16px;
      cursor: pointer;
      border-radius: 4px;
      font-size: 12px;
      transition: all 0.2s;
    }

    button:hover {
      background-color: #2a2a2a;
      color: #fff;
      border-color: #444;
    }

    button.active {
      background-color: #003300;
      color: #0f0;
      border-color: #0f0;
    }

    label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    input[type="checkbox"] {
      cursor: pointer;
      width: 16px;
      height: 16px;
    }

    /* Slider styles */
    .slider-container {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 200px;
    }

    .slider-label {
      font-size: 12px;
      min-width: 100px;
    }

    input[type="range"] {
      flex: 1;
      height: 4px;
      background: #333;
      outline: none;
      -webkit-appearance: none;
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      background: #0f0;
      cursor: pointer;
      border-radius: 50%;
      transition: all 0.2s;
    }

    input[type="range"]::-webkit-slider-thumb:hover {
      background: #0f0;
      box-shadow: 0 0 8px rgba(0, 255, 0, 0.5);
      transform: scale(1.2);
    }

    input[type="range"]:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    input[type="range"]:disabled::-webkit-slider-thumb {
      background: #666;
      cursor: not-allowed;
    }

    .slider-value {
      font-size: 11px;
      color: #0f0;
      min-width: 30px;
      text-align: right;
    }

    .stat-line {
      margin: 4px 0;
    }

    .universe-info {
      color: #0f0;
    }

    .warning {
      color: #f80;
    }

    .error {
      color: #f00;
    }

    #canvas-info {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 11px;
      color: #666;
      text-align: right;
    }

    /* Custom scrollbar for log */
    #log-container::-webkit-scrollbar {
      width: 8px;
    }

    #log-container::-webkit-scrollbar-track {
      background: #0a0a0a;
    }

    #log-container::-webkit-scrollbar-thumb {
      background: #333;
      border-radius: 4px;
    }

    #log-container::-webkit-scrollbar-thumb:hover {
      background: #444;
    }

    /* Loading animation */
    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 1; }
      100% { opacity: 0.5; }
    }

    .loading {
      animation: pulse 2s infinite;
    }
  </style>
</head>
<body>
  <div id="main-container">
    <div id="canvas-container">
      <canvas id="led-canvas"></canvas>
      <div id="canvas-info"></div>
    </div>
    
    <div id="controls">
      <label>
        <input type="checkbox" id="spaced-mode"> Spaced Mode
      </label>
      <div class="slider-container" id="spacing-slider-container" style="display: none;">
        <span class="slider-label">Row Spacing:</span>
        <input type="range" id="spacing-slider" min="0" max="30" value="14" step="1">
        <span class="slider-value" id="spacing-value">14</span>
      </div>
      <label>
        <input type="checkbox" id="show-grid" checked> Show Grid
      </label>
      <label>
        <input type="checkbox" id="show-labels" checked> Show Labels
      </label>
      <label>
        <input type="checkbox" id="auto-scale" checked> Auto Scale
      </label>
      <div class="slider-container">
        <span class="slider-label">Pixel Size:</span>
        <input type="range" id="pixel-radius" min="1" max="10" value="3" step="0.5">
        <span class="slider-value" id="pixel-radius-value">3</span>
      </div>
      <label>
        <input type="checkbox" id="enable-glow" checked> Glow Effect
      </label>
      <button id="clear-log">Clear Log</button>
    </div>
  </div>

  <div id="sidebar">
    <div id="sidebar-header">
      <span id="sidebar-title">SYSTEM STATUS</span>
      <button id="toggle-sidebar" title="Toggle Sidebar">☰</button>
    </div>
    
    <div id="stats">
      <div class="stat-line loading">Waiting for ArtNet data...</div>
    </div>
    
    <div id="log-container"></div>
  </div>

  <script>
    // Global error handler
    window.addEventListener('error', (event) => {
      const errorMsg = `FATAL ERROR: ${event.error.message}`;
      console.error('Renderer error:', event.error);
      
      // Send to main process to log and quit
      if (window.artnetAPI && window.artnetAPI.fatalError) {
        window.artnetAPI.fatalError(errorMsg);
      }
      
      const logContainer = document.getElementById('log-container');
      if (logContainer) {
        const errorDiv = document.createElement('div');
        errorDiv.className = 'log-entry';
        errorDiv.innerHTML = `<span class="log-time">${new Date().toLocaleTimeString()}</span><span class="log-error">${errorMsg}</span>`;
        logContainer.insertBefore(errorDiv, logContainer.firstChild);
      }
      
      // Show error in stats
      const statsDiv = document.getElementById('stats');
      if (statsDiv) {
        statsDiv.innerHTML = `<div class="stat-line error">${errorMsg}</div>`;
      }
    });
  </script>
  <script src="dist/renderer.js"></script>
</body>
</html>
