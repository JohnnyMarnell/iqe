<!DOCTYPE html>
<html>
<head>
    <title>PixelBlaze Fleet</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, system-ui, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        h1 { 
            color: white;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2rem;
        }
        .stats {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .controls {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
            opacity: 0.9;
        }
        .btn:active {
            transform: translateY(0);
        }
        .btn.sync {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
        }
        select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #e5e7eb;
            font-size: 0.9rem;
        }
        .devices {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }
        .device {
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.2s;
        }
        .device:hover { transform: translateY(-2px); }
        .device.offline { opacity: 0.6; }
        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f3f4f6;
        }
        .device-name { 
            font-weight: 600; 
            font-size: 1.2rem;
            color: #1f2937;
        }
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ef4444;
            flex-shrink: 0;
        }
        .status-dot.online {
            background: #10b981;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .device-info {
            color: #6b7280;
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .device-info > div {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            border-bottom: 1px solid #f9fafb;
        }
        .device-info > div:last-child { border-bottom: none; }
        .label { 
            font-weight: 500;
            color: #374151;
        }
        .value { 
            font-family: monospace;
            text-align: right;
        }
        .pattern-name {
            color: #8b5cf6;
            font-weight: 600;
        }
        .brightness-bar {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .brightness-fill {
            flex: 1;
            height: 6px;
            background: #e5e7eb;
            border-radius: 3px;
            overflow: hidden;
        }
        .brightness-level {
            height: 100%;
            background: linear-gradient(90deg, #fbbf24, #f59e0b);
            transition: width 0.3s;
        }
        .no-devices {
            grid-column: 1 / -1;
            text-align: center;
            color: white;
            font-size: 1.2rem;
            padding: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
        }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .error { color: #ef4444; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 PixelBlaze Fleet Monitor</h1>
        <div class="stats">
            <span id="stats">Loading...</span>
        </div>
        <div class="controls">
            <button class="btn sync" onclick="syncRandom()">🎲 Sync Random Pattern</button>
            <select id="patternSelect">
                <option value="">Loading patterns...</option>
            </select>
            <button class="btn" onclick="syncSelected()">🎭 Sync Selected</button>
            <button class="btn sync" onclick="swellAndScatter()" style="background: linear-gradient(135deg, #ef4444, #f59e0b)">
                🎆 Swell & Scatter
            </button>
            <button class="btn" onclick="updateDevices()">🔄 Refresh</button>
            <button class="btn" onclick="runPulse()" style="background: #ff4444">🔴 Pulse & Scatter (40s)</button>
            <button class="btn" onclick="quickPulse()" style="background: #4444ff">⚡ Quick Test (5s)</button>
        </div>
        <div class="devices" id="devices">
            <div class="no-devices">
                <div class="loading"></div>
                <p>Searching for PixelBlaze devices...</p>
            </div>
        </div>
    </div>
    
    <script>
        let devices = new Map();
        
        function updateDevices() {
            fetch('/api/devices')
                .then(r => {
                    if (!r.ok) throw new Error(`HTTP ${r.status}`);
                    return r.json();
                })
                .then(data => {
                    console.log('Got devices:', data);
                    // Update device map
                    data.devices.forEach(d => devices.set(d.id, d));
                    
                    // Update stats
                    const online = data.devices.filter(d => d.online).length;
                    const total = data.devices.length;
                    const totalPixels = data.devices.reduce((sum, d) => sum + (d.pixel_count || 0), 0);
                    document.getElementById('stats').innerHTML = 
                        `${online} online / ${total} total devices | ${totalPixels} pixels | Last update: ${new Date().toLocaleTimeString()}`;
                    
                    // Render devices
                    const container = document.getElementById('devices');
                    
                    if (data.devices.length === 0) {
                        container.innerHTML = `
                            <div class="no-devices">
                                <div class="loading"></div>
                                <p>Searching for PixelBlaze devices...</p>
                                <p style="font-size:0.9rem;margin-top:10px">Make sure devices are powered on and on the same network</p>
                            </div>`;
                        return;
                    }
                    
                    // Sort: online first, then by name
                    const sorted = data.devices.sort((a, b) => {
                        if (a.online !== b.online) return b.online - a.online;
                        const nameA = a.api_name || a.name;
                        const nameB = b.api_name || b.name;
                        return nameA.localeCompare(nameB);
                    });
                    
                    container.innerHTML = sorted.map(d => {
                        const displayName = d.api_name || d.name;
                        const brightnessPercent = Math.round((d.brightness || 0.5) * 100);
                        
                        return `
                        <div class="device ${d.online ? '' : 'offline'}">
                            <div class="device-header">
                                <div class="device-name">${displayName}</div>
                                <div class="status-dot ${d.online ? 'online' : ''}"></div>
                            </div>
                            <div class="device-info">
                                <div>
                                    <span class="label">Pattern:</span>
                                    <span class="value pattern-name">${d.current_pattern || 'Unknown'}</span>
                                </div>
                                <div>
                                    <span class="label">Brightness:</span>
                                    <span class="value">${brightnessPercent}%</span>
                                </div>
                                <div class="brightness-bar">
                                    <div class="brightness-fill">
                                        <div class="brightness-level" style="width: ${brightnessPercent}%"></div>
                                    </div>
                                </div>
                                ${d.pattern_count ? `
                                <div>
                                    <span class="label">Patterns:</span>
                                    <span class="value">${d.pattern_count} available</span>
                                </div>` : ''}
                                ${d.sequencer_mode && d.sequencer_mode !== 'Off' ? `
                                <div>
                                    <span class="label">Sequencer:</span>
                                    <span class="value">${d.sequencer_mode}${d.playlist_length ? ` (${d.playlist_length})` : ''}</span>
                                </div>` : ''}
                                ${d.pixel_count ? `
                                <div>
                                    <span class="label">Pixels:</span>
                                    <span class="value">${d.pixel_count}</span>
                                </div>` : ''}
                                <div>
                                    <span class="label">IP:</span>
                                    <span class="value">${d.ip}</span>
                                </div>
                                <div>
                                    <span class="label">ID:</span>
                                    <span class="value" style="font-size:0.8rem">${d.id}</span>
                                </div>
                                <div>
                                    <span class="label">Last seen:</span>
                                    <span class="value">${d.last_seen_formatted}</span>
                                </div>
                                ${d.api_error ? `
                                <div class="error">API Error: ${d.api_error}</div>` : ''}
                            </div>
                        </div>`;
                    }).join('');
                })
                .catch(err => {
                    console.error('Update error:', err);
                    document.getElementById('stats').innerHTML = 
                        `❌ Connection error | ${new Date().toLocaleTimeString()}`;
                });
        }
        
        // Load common patterns
        function loadPatterns() {
            fetch('/api/common-patterns')
                .then(r => r.json())
                .then(data => {
                    const select = document.getElementById('patternSelect');
                    if (data.patterns && data.patterns.length > 0) {
                        select.innerHTML = '<option value="">Select a pattern...</option>' +
                            data.patterns.map(p => `<option value="${p}">${p}</option>`).join('');
                    } else {
                        select.innerHTML = '<option value="">No common patterns found</option>';
                    }
                })
                .catch(err => console.error('Failed to load patterns:', err));
        }
        
        // Sync random pattern to all devices
        function syncRandom() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ Syncing...';
            
            fetch('/api/sync-random', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    console.log('Sync result:', data);
                    if (data.success) {
                        btn.textContent = `✅ Synced to ${data.successful} devices`;
                        setTimeout(updateDevices, 1000);
                    } else {
                        btn.textContent = '❌ Sync failed';
                        console.error('Sync failed:', data.error);
                    }
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.textContent = '🎲 Sync Random Pattern';
                    }, 2000);
                })
                .catch(err => {
                    console.error('Sync error:', err);
                    btn.textContent = '❌ Error';
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.textContent = '🎲 Sync Random Pattern';
                    }, 2000);
                });
        }
        
        // Sync selected pattern to all devices
        function syncSelected() {
            const select = document.getElementById('patternSelect');
            const pattern = select.value;
            
            if (!pattern) {
                return;
            }
            
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ Syncing...';
            
            fetch(`/api/sync/${encodeURIComponent(pattern)}`, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    console.log('Sync result:', data);
                    if (data.success) {
                        btn.textContent = `✅ Synced ${data.successful}`;
                        setTimeout(updateDevices, 1000);
                    } else {
                        btn.textContent = '❌ Failed';
                        console.error('Sync failed:', data.error);
                    }
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.textContent = '🎭 Sync Selected';
                    }, 2000);
                })
                .catch(err => {
                    console.error('Sync error:', err);
                    btn.textContent = '❌ Error';
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.textContent = '🎭 Sync Selected';
                    }, 2000);
                });
        }
        
        // Dramatic swell and scatter
        function swellAndScatter() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ Starting swell...';
            
            fetch('/api/swell-and-scatter', { 
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    duration: 5.0,  // 5 second swell
                    hue: Math.random()  // Random color each time
                })
            })
                .then(r => r.json())
                .then(data => {
                    console.log('Swell result:', data);
                    if (data.success) {
                        btn.textContent = '🎆 Swelling...';
                        // Button will be re-enabled after the duration
                        setTimeout(() => {
                            btn.disabled = false;
                            btn.textContent = '🎆 Swell & Scatter';
                            updateDevices();  // Refresh to show new patterns
                        }, 6000);  // Duration + 1 second
                    } else {
                        btn.textContent = '❌ Failed';
                        setTimeout(() => {
                            btn.disabled = false;
                            btn.textContent = '🎆 Swell & Scatter';
                        }, 2000);
                    }
                })
                .catch(err => {
                    console.error('Swell error:', err);
                    btn.textContent = '❌ Error';
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.textContent = '🎆 Swell & Scatter';
                    }, 2000);
                });
        }
        
        function runPulse() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ Running (40s)...';
            
            fetch('/api/pulse', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    showToast(data.success ? 
                        '🔴 Pulse sequence started!' : 
                        '❌ ' + (data.message || 'Failed'));
                })
                .catch(err => showToast('❌ Error: ' + err))
                .finally(() => {
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.textContent = '🔴 Pulse & Scatter (40s)';
                    }, 40000);  // Re-enable after 40 seconds
                });
        }
        
        function quickPulse() {
            const btn = event.target;
            btn.disabled = true;
            btn.textContent = '⏳ Running...';
            
            fetch('/api/pulse-quick', { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    showToast(data.success ? 
                        '⚡ Quick test started!' : 
                        '❌ ' + (data.message || 'Failed'));
                })
                .catch(err => showToast('❌ Error: ' + err))
                .finally(() => {
                    setTimeout(() => {
                        btn.disabled = false;
                        btn.textContent = '⚡ Quick Test (5s)';
                    }, 5000);  // Re-enable after 5 seconds
                });
        }
        
        // Initial load and refresh every 3 seconds
        updateDevices();
        loadPatterns();
        setInterval(updateDevices, 3000);
        // Reload patterns occasionally in case new devices come online
        setInterval(loadPatterns, 30000);
    </script>
</body>
</html>
